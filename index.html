<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sardar Sons Billing</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#142033;--muted:#667085;--line:#e5e7eb;--brand:#0b5cab;--brand2:#083b73;--ok:#14804a;--danger:#c92a2a}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;background:var(--brand);color:white}button.secondary{background:#e9eef5;color:#243447}button.danger{background:var(--danger)}.app{min-height:100vh;background:var(--bg)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:white;padding:30px;border-radius:18px;box-shadow:0 15px 45px #10204018}.logo{font-size:30px;font-weight:800;color:var(--brand);margin-bottom:5px}.muted{color:var(--muted);font-size:13px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white}.top{background:linear-gradient(110deg,var(--brand2),var(--brand));color:white;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}.top h1{font-size:21px;margin:0}.top small{opacity:.85}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}aside{background:#102c4e;padding:12px}aside button{display:block;width:100%;text-align:right;margin:5px 0;background:transparent;border:1px solid transparent}aside button:hover,aside button.active{background:#ffffff18;border-color:#ffffff20}.main{padding:20px;max-width:1500px;width:100%;margin:auto}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}.card b{display:block;font-size:21px;margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:15px}.panel h2{font-size:17px;margin:0 0 13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{background:#f7f9fc}.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{padding:25px;text-align:center;color:var(--muted)}.hidden{display:none!important}.stat-ok{color:var(--ok)}.stat-danger{color:var(--danger)}.invoice{max-width:900px;margin:auto}.invoice-head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:10px}.invoice-lines input,.invoice-lines select{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px}.total{text-align:left;font-size:19px;font-weight:800}.printbar{display:flex;gap:8px;justify-content:flex-end;margin:12px 0}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:5px}aside button{min-width:120px;text-align:center}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.main{padding:10px}.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.top h1{font-size:17px}}
@media print{body{background:#fff}.no-print{display:none!important}.print-a4{display:block!important}@page{size:A4;margin:10mm}}
</style></head><body><div id="app"></div><script>
const KEY='sardar_sons_v2';const seed={settings:{company:'Sardar Sons',address:'Main Street, Muhammadi Town, Sohan, Islamabad',phone1:'03260272829',phone2:'03329898774',user:'admin',pass:'12345'},products:[],customers:[],vendors:[],staff:[],expenses:[],sales:[],purchases:[],payments:[]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;let page='dashboard';let editId=null;let cart=[];function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){return Date.now()+Math.random().toString(16).slice(2)}function money(n){return 'Rs. '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function next(prefix,arr){let n=arr.length+1;let used=new Set(arr.map(x=>x.no||x.code));while(used.has(prefix+String(n).padStart(5,'0')))n++;return prefix+String(n).padStart(5,'0')}
function layout(){document.getElementById('app').innerHTML=`<div class="top"><div><h1>${esc(db.settings.company)}</h1><small>${esc(db.settings.address)} · ${esc(db.settings.phone1)} / ${esc(db.settings.phone2)}</small></div><div><button class="secondary" onclick="logout()">Logout</button></div></div><div class="layout"><aside>${[['dashboard','Dashboard'],['products','Products / Stock'],['sales','Sales / Invoice'],['purchases','Purchases'],['customers','Customers / Ledger'],['vendors','Vendors / Ledger'],['staff','Staff / Salaries'],['expenses','Expenses'],['reports','Reports'],['settings','Settings']].map(([k,v])=>`<button class="${page==k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}</aside><main class="main" id="main"></main></div>`;render()}
function go(p){page=p;editId=null;cart=[];layout()}function render(){let m=document.getElementById('main');m.innerHTML=pages[page]?pages[page]():''}
function dashboard(){let sales=db.sales.reduce((a,x)=>a+x.total,0),pur=db.purchases.reduce((a,x)=>a+x.total,0),exp=db.expenses.reduce((a,x)=>a+x.amount,0),recv=db.sales.reduce((a,x)=>a+x.balance,0),pay=db.purchases.reduce((a,x)=>a+x.balance,0),stock=db.products.reduce((a,x)=>a+x.stock,0);return `<h2>Dashboard</h2><div class="cards"><div class="card">Sales<b>${money(sales)}</b></div><div class="card">Purchases<b>${money(pur)}</b></div><div class="card">Receivable<b>${money(recv)}</b></div><div class="card">Payable<b>${money(pay)}</b></div><div class="card">Stock Qty<b>${stock}</b></div><div class="card">Expenses<b>${money(exp)}</b></div></div><div class="grid2"><div class="panel"><h2>Quick Actions</h2><div class="toolbar"><button onclick="go('sales')">+ New Sale</button><button onclick="go('purchases')">+ New Purchase</button><button onclick="go('products')">+ Product</button><button onclick="go('customers')">+ Customer</button></div></div><div class="panel"><h2>Login</h2><p class="muted">Temporary login: <b>${esc(db.settings.user)}</b> / <b>${esc(db.settings.pass)}</b></p></div></div>`}
function products(){return `<h2>Products / Stock</h2><div class="panel"><div class="toolbar"><button onclick="productForm()">+ Add Product</button></div>${table(db.products,['code','name','unit','purchase','sale','stock'],x=>`<div class="actions"><button onclick="productForm('${x.id}')">Edit</button><button class="danger" onclick="del('products','${x.id}')">Delete</button></div>`)}</div>`}
function productForm(i){let x=db.products.find(a=>a.id==i)||{name:'',unit:'pcs',purchase:0,sale:0,stock:0};document.getElementById('main').innerHTML=`<div class="panel"><h2>${i?'Edit':'Add'} Product</h2><div class="grid2"><div class="field"><label>Product Name</label><input id="pname" value="${esc(x.name)}"></div><div class="field"><label>Unit</label><input id="punit" value="${esc(x.unit)}"></div><div class="field"><label>Purchase Rate</label><input id="ppur" type="number" value="${x.purchase}"></div><div class="field"><label>Sale Rate</label><input id="psale" type="number" value="${x.sale}"></div><div class="field"><label>Opening Stock</label><input id="pstock" type="number" value="${x.stock}"></div></div><button onclick="saveProduct('${i||''}')">Save</button> <button class="secondary" onclick="go('products')">Cancel</button></div>`}
function saveProduct(i){let x=db.products.find(a=>a.id==i);if(x){Object.assign(x,{name:pname.value,unit:punit.value,purchase:+ppur.value,sale:+psale.value,stock:+pstock.value})}else db.products.push({id:id(),code:next('SS-',db.products).replace('SS-','SS-'),name:pname.value,unit:punit.value,purchase:+ppur.value,sale:+psale.value,stock:+pstock.value});save();go('products')}
function customers(){return `<h2>Customers / Ledger</h2><div class="panel"><button onclick="partyForm('customers')">+ Add Customer</button>${table(db.customers,['name','phone','credit'],x=>{let b=db.sales.filter(s=>s.customer==x.id).reduce((a,s)=>a+s.balance,0)-db.payments.filter(p=>p.party==x.id&&p.type=='customer').reduce((a,p)=>a+p.amount,0);return `<span>${money(b)}</span> <button onclick="partyForm('customers','${x.id}')">Edit</button> <button class="danger" onclick="del('customers','${x.id}')">Delete</button>`})}</div>`}
function vendors(){return `<h2>Vendors / Ledger</h2><div class="panel"><button onclick="partyForm('vendors')">+ Add Vendor</button>${table(db.vendors,['name','phone'],x=>{let b=db.purchases.filter(s=>s.vendor==x.id).reduce((a,s)=>a+s.balance,0)-db.payments.filter(p=>p.party==x.id&&p.type=='vendor').reduce((a,p)=>a+p.amount,0);return `<span>${money(b)}</span> <button onclick="partyForm('vendors','${x.id}')">Edit</button> <button class="danger" onclick="del('vendors','${x.id}')">Delete</button>`})}</div>`}
function partyForm(type,i){let x=db[type].find(a=>a.id==i)||{name:'',phone:'',credit:0};document.getElementById('main').innerHTML=`<div class="panel"><h2>${i?'Edit':'Add'} ${type==='customers'?'Customer':'Vendor'}</h2><div class="grid2"><div class="field"><label>Name</label><input id="n" value="${esc(x.name)}"></div><div class="field"><label>Phone</label><input id="ph" value="${esc(x.phone)}"></div>${type==='customers'?`<div class="field"><label>Credit Limit</label><input id="cr" type="number" value="${x.credit||0}"></div>`:''}</div><button onclick="saveParty('${type}','${i||''}')">Save</button> <button class="secondary" onclick="go('${type}')">Cancel</button></div>`}
function saveParty(type,i){let arr=db[type],x=arr.find(a=>a.id==i);if(x)Object.assign(x,{name:n.value,phone:ph.value,credit:+(document.getElementById('cr')?.value||0)});else arr.push({id:id(),name:n.value,phone:ph.value,credit:+(document.getElementById('cr')?.value||0)});save();go(type)}
function staff(){return `<h2>Staff / Salaries</h2><div class="panel"><button onclick="staffForm()">+ Add Staff</button>${table(db.staff,['name','role','salary'],x=>`<button onclick="staffForm('${x.id}')">Edit</button> <button class="danger" onclick="del('staff','${x.id}')">Delete</button>`)}</div>`}function staffForm(i){let x=db.staff.find(a=>a.id==i)||{name:'',role:'',salary:0};document.getElementById('main').innerHTML=`<div class="panel"><h2>Staff</h2><div class="grid2"><div class="field"><label>Name</label><input id="n" value="${esc(x.name)}"></div><div class="field"><label>Role</label><input id="r" value="${esc(x.role)}"></div><div class="field"><label>Monthly Salary</label><input id="s" type="number" value="${x.salary}"></div></div><button onclick="saveStaff('${i||''}')">Save</button> <button class="secondary" onclick="go('staff')">Cancel</button></div>`}function saveStaff(i){let x=db.staff.find(a=>a.id==i);if(x)Object.assign(x,{name:n.value,role:r.value,salary:+s.value});else db.staff.push({id:id(),name:n.value,role:r.value,salary:+s.value});save();go('staff')}
function expenses(){return `<h2>Expenses</h2><div class="panel"><button onclick="expenseForm()">+ Add Expense</button>${table(db.expenses,['date','category','note','amount'],x=>`<button class="danger" onclick="del('expenses','${x.id}')">Delete</button>`)}</div>`}function expenseForm(){document.getElementById('main').innerHTML=`<div class="panel"><h2>Add Expense</h2><div class="grid2"><div class="field"><label>Date</label><input id="d" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Category</label><select id="c"><option>Fuel</option><option>Bill / Utility</option><option>Salary</option><option>Transport</option><option>Rent</option><option>Other</option></select></div><div class="field"><label>Note</label><input id="nt"></div><div class="field"><label>Amount</label><input id="a" type="number"></div></div><button onclick="saveExpense()">Save</button> <button class="secondary" onclick="go('expenses')">Cancel</button></div>`}function saveExpense(){db.expenses.push({id:id(),date:d.value,category:c.value,note:nt.value,amount:+a.value});save();go('expenses')}
function sales(){return invoicePage('sale')}function purchases(){return invoicePage('purchase')}function invoicePage(type){let arr=type==='sale'?db.sales:db.purchases;return `<h2>${type==='sale'?'Sales / Invoice':'Purchases'}</h2><div class="panel"><div class="toolbar"><button onclick="newInvoice('${type}')">+ New ${type==='sale'?'Invoice':'Purchase'}</button></div>${table(arr,['no','date','party','total','paid','balance'],x=>`<button onclick="viewInvoice('${type}','${x.id}')">View / Print</button>`)}</div>`}
function newInvoice(type){cart=[{product:'',qty:1,rate:0}];document.getElementById('main').innerHTML=invoiceEditor(type)}function invoiceEditor(type){let parties=type==='sale'?db.customers:db.vendors;return `<div class="panel invoice"><div class="invoice-head"><div><h2>${type==='sale'?'Sales Invoice':'Purchase Invoice'}</h2><small>${esc(db.settings.company)}<br>${esc(db.settings.address)}</small></div><div><b>${type==='sale'?next('INV-',db.sales):next('PUR-',db.purchases)}</b><br><input id="dt" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="grid2"><div class="field"><label>${type==='sale'?'Customer':'Vendor'}</label><select id="party"><option value="">Cash / Walk-in</option>${parties.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Paid</label><input id="paid" type="number" value="0"></div></div><div id="lines"></div><button onclick="addLine('${type}')">+ Add Item</button><div class="total" id="tot"></div><div class="printbar"><button onclick="saveInvoice('${type}')">Save & Print A4</button><button class="secondary" onclick="saveInvoice('${type}','thermal')">Save & Print 80mm</button><button class="secondary" onclick="go('${type==='sale'?'sales':'purchases'}')">Cancel</button></div></div>`}function addLine(type){cart.push({product:'',qty:1,rate:0});drawLines(type)}function drawLines(type){let el=document.getElementById('lines');if(!el)return;el.innerHTML=`<table class="invoice-lines"><thead><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th><th></th></tr></thead><tbody>${cart.map((l,i)=>`<tr><td><select onchange="lineProduct(${i},this.value,'${type}')"><option value="">Select</option>${db.products.map(p=>`<option value="${p.id}" ${p.id==l.product?'selected':''}>${esc(p.name)} (${esc(p.code)})</option>`).join('')}</select></td><td><input type="number" min="1" value="${l.qty}" onchange="lineQty(${i},this.value,'${type}')"></td><td><input type="number" value="${l.rate}" onchange="lineRate(${i},this.value,'${type}')"></td><td>${money(l.qty*l.rate)}</td><td><button class="danger" onclick="cart.splice(${i},1);drawLines('${type}')">×</button></td></tr>`).join('')}</tbody></table>`;document.getElementById('tot').textContent='Total: '+money(cart.reduce((a,l)=>a+l.qty*l.rate,0))}function lineProduct(i,v,type){let p=db.products.find(x=>x.id==v);cart[i].product=v;cart[i].rate=p?(type==='sale'?p.sale:p.purchase):0;drawLines(type)}function lineQty(i,v,type){cart[i].qty=+v||1;drawLines(type)}function lineRate(i,v,type){cart[i].rate=+v||0;drawLines(type)}
function saveInvoice(type,printMode){let total=cart.reduce((a,l)=>a+l.qty*l.rate,0),paidv=+paid.value||0;if(!cart.some(l=>l.product&&l.qty>0))return alert('Product select karein');let partyv=party.value;let obj={id:id(),no:type==='sale'?next('INV-',db.sales):next('PUR-',db.purchases),date:dt.value,customer:type==='sale'?partyv:'',vendor:type==='purchase'?partyv:'',items:cart.filter(l=>l.product).map(l=>({...l})),total,paid:paidv,balance:Math.max(0,total-paidv)};if(type==='sale'&&partyv){let c=db.customers.find(x=>x.id==partyv);let old=db.sales.filter(s=>s.customer==partyv).reduce((a,s)=>a+s.balance,0)-db.payments.filter(p=>p.party==partyv&&p.type=='customer').reduce((a,p)=>a+p.amount,0);if(c&&c.credit&&old+obj.balance>c.credit)return alert('Credit limit exceed ho raha hai');}db[type==='sale'?'sales':'purchases'].push(obj);obj.items.forEach(l=>{let p=db.products.find(x=>x.id==l.product);if(p)p.stock += type==='sale'?-l.qty:l.qty});save();printInvoice(type,obj,printMode)}
function viewInvoice(type,i){let obj=(type==='sale'?db.sales:db.purchases).find(x=>x.id==i);printInvoice(type,obj,'view')}function printInvoice(type,o,mode){let party=type==='sale'?db.customers.find(x=>x.id==o.customer):db.vendors.find(x=>x.id==o.vendor);document.getElementById('main').innerHTML=`<div class="panel invoice" id="printArea"><div class="invoice-head"><div><h2>${esc(db.settings.company)}</h2><div>${esc(db.settings.address)}<br>${esc(db.settings.phone1)} / ${esc(db.settings.phone2)}</div></div><div><b>${esc(o.no)}</b><br>${esc(o.date)}</div></div><p>${type==='sale'?'Customer':'Vendor'}: <b>${esc(party?.name||'Cash / Walk-in')}</b></p><table><thead><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead><tbody>${o.items.map(l=>{let p=db.products.find(x=>x.id==l.product);return `<tr><td>${esc(p?.name||'')}</td><td>${l.qty}</td><td>${money(l.rate)}</td><td>${money(l.qty*l.rate)}</td></tr>`}).join('')}</tbody></table><h2 class="total">Total: ${money(o.total)}</h2><p class="total">Paid: ${money(o.paid)} &nbsp; Balance: ${money(o.balance)}</p></div><div class="printbar no-print"><button onclick="window.print()">Print</button><button class="secondary" onclick="go('${type==='sale'?'sales':'purchases'}')">Back</button></div>`;if(mode==='thermal'){setTimeout(()=>{let st=document.createElement('style');st.textContent='@media print{@page{size:80mm auto;margin:3mm}body{width:80mm}.invoice{border:0!important;padding:0!important;font-size:11px}.invoice table{min-width:0;font-size:10px}.invoice th,.invoice td{padding:4px 2px}}';document.head.appendChild(st);window.print()},150)}}
function reports(){return `<h2>Reports</h2><div class="grid2"><div class="panel"><h2>Stock Report</h2>${table(db.products,['code','name','stock','purchase','sale'],()=>'-')}</div><div class="panel"><h2>Expenses</h2>${table(db.expenses,['date','category','amount'],()=>'-')}</div></div><div class="panel"><h2>Customer Outstanding</h2>${db.customers.map(c=>{let b=db.sales.filter(s=>s.customer==c.id).reduce((a,s)=>a+s.balance,0)-db.payments.filter(p=>p.party==c.id&&p.type=='customer').reduce((a,p)=>a+p.amount,0);return `<p>${esc(c.name)} — ${money(b)}</p>`}).join('')||'<div class="empty">No customers</div>'}</div>`}
function settings(){return `<h2>Settings</h2><div class="panel"><div class="grid2"><div class="field"><label>Company</label><input id="co" value="${esc(db.settings.company)}"></div><div class="field"><label>Address</label><input id="ad" value="${esc(db.settings.address)}"></div><div class="field"><label>Phone 1</label><input id="ph1" value="${esc(db.settings.phone1)}"></div><div class="field"><label>Phone 2</label><input id="ph2" value="${esc(db.settings.phone2)}"></div><div class="field"><label>Username</label><input id="un" value="${esc(db.settings.user)}"></div><div class="field"><label>Password</label><input id="pw" value="${esc(db.settings.pass)}"></div></div><button onclick="saveSettings()">Save Settings</button><button class="danger" onclick="if(confirm('All local data delete?')){localStorage.removeItem(KEY);location.reload()}">Reset All Data</button></div>`}function saveSettings(){Object.assign(db.settings,{company:co.value,address:ad.value,phone1:ph1.value,phone2:ph2.value,user:un.value,pass:pw.value});save();layout()}
function table(arr,cols,actions){if(!arr.length)return '<div class="empty">No data</div>';return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Actions / Balance</th></tr></thead><tbody>${arr.map(x=>`<tr>${cols.map(c=>`<td>${esc(c==='purchase'||c==='sale'||c==='salary'||c==='amount'||c==='total'||c==='paid'||c==='balance'?money(x[c]):x[c])}</td>`).join('')}<td>${actions(x)}</td></tr>`).join('')}</tbody></table></div>`}function del(type,i){if(confirm('Delete?')){db[type]=db[type].filter(x=>x.id!=i);save();go(type==='products'?'products':type)}}function logout(){location.reload()}
const pages={dashboard:dashboard,products:products,sales:sales,purchases:purchases,customers:customers,vendors:vendors,staff:staff,expenses:expenses,reports:reports,settings:settings};function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><div class="logo">Sardar Sons</div><p class="muted">Hardware Billing & Stock Management</p><div class="field"><label>Username</label><input id="lu"></div><div class="field"><label>Password</label><input id="lp" type="password"></div><button style="width:100%" onclick="if(lu.value===db.settings.user&&lp.value===db.settings.pass){layout()}else alert('Username ya password ghalat hai')">Login</button><p class="muted" style="margin-top:15px">Temporary: admin / 12345</p></div></div>`}login();
</script></div></body></html>
